name: Shell Tests
on:
  push:
    branches:
      - '**'
    paths:
      - 'lib/.staging'
      - 'tests/bash/**'
      - '.github/workflows/shell-tests.yml'
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]
    paths:
      - 'lib/.staging'
      - 'tests/bash/**'
      - '.github/workflows/shell-tests.yml'
  workflow_dispatch:

# Disable permissions for all available scopes by default.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  bash-unit:
    name: Staging script unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to clone the repository (checkout).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The staging worker (lib/.staging) runs server-side via PHP exec() and is not exercised by the
      # PHP (wpunit) or Playwright suites, so these bash tests are its only automated coverage. The
      # prefix tests are pure string logic; the content-dir and lock tests do real filesystem work in
      # temp dirs. None of them needs a database or wp-cli.
      #
      # The lock tests need util-linux `flock` and a non-root user, and skip the assertions that
      # depend on them otherwise. The GitHub runner provides both, so a run here that reports skips
      # means something changed about the environment.
      - name: Run staging bash unit tests
        run: |
          status=0
          for t in tests/bash/test-*.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
